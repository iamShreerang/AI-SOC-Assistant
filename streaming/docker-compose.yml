services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST is the listener reachable from the Docker host (localhost:9092).
      # PLAINTEXT_INTERNAL is used for container-to-container traffic (kafka:29092).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Creates the unsw-logs topic explicitly so producers don't race against
  # auto-creation on first publish.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic unsw-logs
        --partitions 3
        --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic predictions
        --partitions 3
        --replication-factor 1 &&
       echo 'Topics created successfully'"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: bitnami/spark:3.5
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: soc_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d soc_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/soc_db
      ELASTICSEARCH_ENABLED: "false"
    ports:
      - "8000:8000"
    restart: on-failure

  # Publishes streaming/sample_logs/*.jsonl to Kafka on a loop.
  # Run `py streaming/sample_logs/generate.py` first if that folder is empty.
  log-producer:
    build:
      context: ..
      dockerfile: streaming/Dockerfile.producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_INPUT_TOPIC: unsw-logs
      PRODUCER_DELAY_SECS: "0.5"
    restart: on-failure

  # Consumes Kafka, runs CNN-LSTM inference + threat-rule evaluation, and
  # posts results into the FastAPI backend's /ingest/* endpoints.
  spark-streaming:
    build:
      context: ..
      dockerfile: streaming/Dockerfile.spark
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      backend:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_INPUT_TOPIC: unsw-logs
      KAFKA_OUTPUT_TOPIC: predictions
      SPARK_MASTER: local[*]
      MODEL_DIR: /app/ml/saved_models
      SPARK_CHECKPOINT_DIR: /tmp/soc-checkpoint
      BATCH_INTERVAL_SECS: "5"
      METRICS_PUBLISH_SECS: "15"
      BACKEND_API_URL: http://backend:8000
      HEARTBEAT_INTERVAL_SECS: "30"
    restart: on-failure
