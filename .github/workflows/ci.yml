name: Backend CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: soc_admin
          POSTGRES_PASSWORD: soc_password
          POSTGRES_DB: soc_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://soc_admin:soc_password@localhost:5432/soc_db
        run: alembic upgrade head

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          DATABASE_URL: postgresql://soc_admin:soc_password@localhost:5432/soc_db
        run: pytest tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ai-soc-assistant-backend:latest
